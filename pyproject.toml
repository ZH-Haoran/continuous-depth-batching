[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/looped_cdb"]

[project]
name = "looped-cdb"
version = "0.1.0"
description = "Depth-adaptive Inference of Looped Language Models via Continuous Depth Batching"
authors = [{ name = "Kristian Schwethelm" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "flash-attn-3==3.0.0",
    "pyarrow>=24.0.0",
    "torch==2.11.0",
    "transformers==5.9.0",
]

[project.optional-dependencies]
# FA2 fallback compiled from source. sync with `--extra fa2`; psutil is a build dep of the compile
fa2 = [
    "flash-attn==2.8.3.post1 ; python_version == '3.12'",
    "psutil>=7.2.2",
]
# For exit-gate distillation training
train = [
    "accelerate>=1.13.0",
    "trl==1.7.0",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.uv]
package = true
# flash-attn (FA2) builds from the PyPI sdist against the already-synced environment.
# Set FLASH_ATTENTION_FORCE_BUILD=TRUE in the sync environment for a deterministic local
# compile. The first build takes a while; uv caches the built wheel afterwards.
no-build-isolation-package = ["flash-attn"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[tool.uv.sources]
flash-attn-3 = { index = "pytorch-cu129" }
torch = [
    { index = "pytorch-cu129" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "src/looped_cdb/models/ouro/configuration_ouro.py",
    "src/looped_cdb/models/ouro/modeling_ouro.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "cuda: marks tests as requiring CUDA and an explicit CUDA test run",
]
